<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Portfolio</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #0f172a; color: #fff; }
        nav { display: flex; justify-content: space-between; padding: 20px; background: #1e293b; }
        nav a { color: #fff; text-decoration: none; margin: 0 10px; }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; text-align: center; }
        .profile-img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 4px solid #38bdf8; }
        .btn { display: inline-block; padding: 10px 20px; background: #38bdf8; color: #000; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 15px; }

        /* --- ใส่ CSS Animation ตรงนี้ --- */
        @keyframes bounceUp {
            0% { opacity: 0; transform: translateY(60px); }
            60% { opacity: 1; transform: translateY(-8px); }
            80% { transform: translateY(4px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .animate-up {
            opacity: 0;
            animation: bounceUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.3s; }
        .delay-3 { animation-delay: 0.5s; }
        .delay-4 { animation-delay: 0.7s; }
    </style>
</head>
<body>

    <nav class="animate-up delay-1">
        <div><strong>PORTFOLIO</strong></div>
        <div>
            <a href="index.html">หน้าแรก</a>
            <a href="me.html">ข้อมูลส่วนตัว</a>
            <a href="portfolio.html">แฟ้มสะสมผลงาน</a>
        </div>
    </nav>

    <div class="container">
        <!-- รูปโปรไฟล์เด้งมาก่อน -->
        <img src="profile.jpg" alt="รูปโปรไฟล์" class="profile-img animate-up delay-2">
        
        <!-- ข้อความตามมา -->
        <div class="animate-up delay-3">
            <p style="color: #38bdf8;">ACADEMIC PORTFOLIO</p>
            <h1>สวัสดีครับ ผม [ชื่อ-นามสกุล]</h1>
            <p>นักเรียนผู้มีความสนใจด้านวิทยาการคอมพิวเตอร์และการพัฒนาซอฟต์แวร์</p>
        </div>

        <hr style="margin: 30px 0; border-color: #334155;">

        <!-- คำนำ และปุ่มเด้งตามมาเป็นส่วนสุดท้าย -->
        <div class="animate-up delay-4">
            <h2>คำนำ (Foreword)</h2>
            <p>แฟ้มสะสมผลงานเล่มนี้จัดทำขึ้นเพื่อนำเสนอประวัติ ผลงาน และความสามารถ...</p>
            <a href="me.html" class="btn">เข้าชมข้อมูลส่วนตัว</a>
        </div>
    </div>

</body>
</html>
