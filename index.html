<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ธนภัทร แซ่ฟุ้ง | Academic Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0d10;
      --card-bg: rgba(22, 27, 38, 0.75);
      --gold-primary: #D4AF37;
      --gold-light: #F7E7A9;
      --gold-dark: #A37A17;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --bounce-timing: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans Thai', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background: radial-gradient(circle at 50% 20%, #161c24 0%, #0b0d10 85%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    /* Animation Keyframes */
    @keyframes floatAnimation {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.25); }
      50% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.5); }
    }

    /* 1. Top Navigation Bar */
    .navbar {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.25);
      backdrop-filter: blur(16px);
      padding: 0.6rem 1.8rem;
      border-radius: 50px;
      width: 100%;
      max-width: 780px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s var(--bounce-timing), border-color 0.3s ease;
    }

    .navbar:hover {
      border-color: var(--gold-primary);
    }

    .nav-brand {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 1.5px;
      color: var(--gold-primary);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .nav-item {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      transition: all 0.3s var(--bounce-timing);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.15);
      transform: translateY(-2px);
    }

    /* 2. Main Hero Section */
    .hero-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 800px;
      margin-top: 3.5rem;
      padding: 0 1rem;
    }

    /* Profile Avatar with Ring */
    .avatar-ring {
      position: relative;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
      animation: floatAnimation 5s ease-in-out infinite, pulseGlow 3s ease-in-out infinite;
      transition: transform 0.4s var(--bounce-timing);
      margin-bottom: 1.8rem;
    }

    .avatar-ring:hover {
      transform: scale(1.08) rotate(2deg);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #0d1117;
    }

    /* Academic Badge */
    .academic-badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.35);
      color: var(--gold-light);
      padding: 0.45rem 1.4rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 1.8rem;
      transition: transform 0.3s var(--bounce-timing);
    }

    .academic-badge:hover {
      transform: translateY(-3px) scale(1.05);
      background: rgba(212, 175, 55, 0.2);
    }

    /* Heading & Text */
    .hero-title {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 1.2rem;
      color: #ffffff;
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #FFFFFF 0%, #F7E7A9 40%, #D4AF37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.8;
      max-width: 680px;
      margin-bottom: 2.5rem;
    }

    /* 3. Action Pill Button */
    .btn-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 2.2rem;
      border-radius: 50px;
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.4s var(--bounce-timing), background 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.15);
    }

    .btn-pill:hover {
      background: linear-gradient(135deg, #D4AF37 0%, #A37A17 100%);
      color: #0b0d10;
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 12px 25px rgba(212, 175, 55, 0.4);
    }

    @media (max-width: 600px) {
      .navbar {
        flex-direction: column;
        gap: 0.8rem;
        border-radius: 25px;
      }
      .hero-title {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">THANAPHAT</a>
    <div class="nav-links">
      <a href="index.html" class="nav-item active">🏠 หน้าแรก</a>
      <a href="portfolio.html" class="nav-item">📁 แฟ้มสะสมผลงาน</a>
    </div>
  </nav>

  <!-- Main Hero Content -->
  <main class="hero-container">
    
    <!-- Profile Picture Ring -->
    <div class="avatar-ring">
      <img src="profile.jpg" alt="ธนภัทร แซ่ฟุ้ง" class="avatar-img">
    </div>

    <!-- Academic Badge -->
    <div class="academic-badge">DEK70 ACADEMIC PORTFOLIO</div>

    <!-- Greeting Heading -->
    <h1 class="hero-title">
      สวัสดีครับ ผม <span class="gold-gradient-text">นายธนภัทร แซ่ฟุ้ง</span>
    </h1>

    <!-- Description -->
    <p class="hero-desc">
      นักเรียนผู้มีความสนใจด้าน Internet of Things (IoT), ปัญญาประดิษฐ์ (AI), ความปลอดภัยทางไซเบอร์ และวิทยาการคอมพิวเตอร์ เตรียมความพร้อมสำหรับการศึกษาต่อระดับอุดมศึกษา
    </p>

    <!-- CTA Button -->
    <a href="portfolio.html" class="btn-pill">
      ชมแฟ้มสะสมผลงาน (Portfolio) &darr;
    </a>

  </main>

</body>
</html>
