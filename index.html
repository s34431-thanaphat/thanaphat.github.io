<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanaphat | Personal Profile</title>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: rgba(22, 27, 38, 0.75);
      --accent-cyan: #38bdf8;
      --accent-purple: #c084fc;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --glow-cyan: rgba(56, 189, 248, 0.4);
      --glow-purple: rgba(192, 132, 252, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(192, 132, 252, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(56, 189, 248, 0.15) 0%, transparent 45%);
    }

    .profile-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      width: 100%;
      max-width: 480px;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      transition: border-color 0.3s ease;
    }

    .profile-card:hover {
      border-color: rgba(56, 189, 248, 0.3);
    }

    /* กรอบรูปภาพนีออนเรืองแสง */
    .avatar-wrapper {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 2rem;
    }

    .avatar-wrapper::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      filter: blur(8px);
      opacity: 0.8;
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.6; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }

    .avatar-img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #0d1117;
    }

    .name {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }

    .role {
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }

    .badges {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 2rem;
    }

    .badge {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 0.35rem 0.9rem;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .btn-primary {
      display: block;
      padding: 0.9rem 1.5rem;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      color: #0d1117;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <!-- กรอบรูปโปรไฟล์เรืองแสง -->
    <div class="avatar-wrapper">
      <img src="profile.jpg" alt="Thanaphat" class="avatar-img">
    </div>

    <!-- ชื่อและรายละเอียด -->
    <h1 class="name">THANAPHAT</h1>
    <p class="role">Developer & Tech Enthusiast</p>

    <!-- แท็กความสามารถ / ความสนใจ -->
    <div class="badges">
      <span class="badge">IoT</span>
      <span class="badge">AI & Cyber Security</span>
      <span class="badge">Web Developer</span>
    </div>

    <!-- ปุ่มลิงก์ไปยัง Portfolio -->
    <div class="actions">
      <a href="portfolio.html" class="btn-primary">ชมผลงานทั้งหมด (Portfolio) →</a>
    </div>
  </div>

</body>
</html>
